<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18101F"/>
      <stop offset="100%" stop-color="#0D0518"/>
    </linearGradient>
    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB8D5"/>
      <stop offset="30%" stop-color="#FF3D8A"/>
      <stop offset="55%" stop-color="#FF8A3D"/>
      <stop offset="95%" stop-color="#7FE0EB"/>
    </linearGradient>
    <radialGradient id="glowMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3D8A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF3D8A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTurquoise" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7FE0EB" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7FE0EB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Background glows -->
  <circle cx="1050" cy="120" r="320" fill="url(#glowMagenta)"/>
  <circle cx="150" cy="520" r="300" fill="url(#glowTurquoise)"/>

  <!-- Eyebrow tag -->
  <g transform="translate(80, 130)">
    <rect width="270" height="36" rx="18" fill="#7FE0EB" fill-opacity="0.08" stroke="#7FE0EB" stroke-opacity="0.2"/>
    <text x="135" y="23" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#7FE0EB" letter-spacing="2" text-anchor="middle">SOFTWARE ENGINEER</text>
  </g>

  <!-- Name -->
  <text x="80" y="280" font-family="Inter, sans-serif" font-size="92" font-weight="800" fill="url(#nameGradient)" letter-spacing="-2">Alejandro Pérez</text>

  <!-- Headline line 1 -->
  <text x="80" y="360" font-family="Inter, sans-serif" font-size="40" font-weight="600" fill="#EFE2D2" letter-spacing="-0.5">Backend infrastructure</text>

  <!-- Headline line 2 -->
  <text x="80" y="412" font-family="Inter, sans-serif" font-size="40" font-weight="600" fill="#EFE2D2" letter-spacing="-0.5" xml:space="preserve"><tspan>that gets </tspan><tspan fill="#FFB8D5" font-style="italic">quieter</tspan><tspan>, not louder.</tspan></text>

  <!-- Subline -->
  <text x="80" y="478" font-family="Inter, sans-serif" font-size="22" font-weight="400" fill="#EFE2D2" fill-opacity="0.62">Founding engineer at Awtomic (YC S20) · Distributed systems &amp; observability · Madrid</text>

  <!-- Footer URL -->
  <text x="80" y="560" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="500" fill="#7FE0EB" letter-spacing="1">alejandroperez.dev</text>

  <!-- Right corner mark -->
  <text x="1120" y="560" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="url(#nameGradient)" letter-spacing="-0.5" text-anchor="end">73nko</text>
</svg>
